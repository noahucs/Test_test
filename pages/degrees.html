<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../scripts/degrees.js" defer></script>
  </head>

  <body class="min-h-screen bg-slate-50">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
        <h1 class="text-lg font-bold text-blue-900">Measurement Converter</h1>
        <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
          CPRG 306: Assignment 1
        </span>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-6 py-10">
      <div class="rounded-2xl bg-white p-6 shadow-md sm:p-8">
        <h2 class="text-lg font-bold text-slate-900">Temperature</h2>
        <p class="mt-1 text-sm text-slate-500">
          Convert Celsius and Fahrenheit.
        </p>

        <form id="temperature-form" class="mt-6 space-y-4">
          <div>
            <label for="direction" class="block font-medium">Convert from</label>
            <select id="direction" class="mt-1 w-full rounded-lg border border-slate-300 p-3">
              <option value="C-F">Celsius to Fahrenheit</option>
              <option value="F-C">Fahrenheit to Celsius</option>
            </select>
          </div>

          <div>
            <label for="values" class="block font-medium">Value or list of values</label>
            <input
              id="values"
              type="text"
              required
              placeholder="Example: 25 or 0, 25, 100"
              class="mt-1 w-full rounded-lg border border-slate-300 p-3"
            />
            <p class="mt-1 text-sm text-slate-500">
              Separate multiple numbers with commas.
            </p>
          </div>

          <button
            type="submit"
            class="rounded-lg bg-blue-700 px-5 py-3 font-semibold text-white hover:bg-blue-800"
          >
            Convert
          </button>
        </form>

        <p id="error" role="alert" class="mt-4 text-red-700"></p>

        <div id="result-box" class="mt-6 hidden rounded-xl border border-blue-200 bg-blue-50 p-6">
          <h3 class="font-bold text-slate-900">Result</h3>
          <p id="result" aria-live="polite" class="mt-3 whitespace-pre-line text-lg text-slate-900"></p>
        </div>

        <a href="index.html" class="mt-8 inline-block text-sm font-medium text-blue-700 hover:underline">
          Back to home
        </a>
      </div>
    </main>
  </body>
</html>
